<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        /* Custom Styles */
        .sidebar-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            height: calc(100vh - 48px);
            overflow-y: auto;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .nav-link {
            border-radius: 0.375rem;
            margin: 0.125rem 0.5rem;
            padding: 0.75rem 1rem !important;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-link.active {
            background-color: var(--primary-color);
            color: white !important;
        }

        .card {
            border-radius: 0.75rem;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .badge.rounded-circle {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .list-group-item {
            border-left: 0;
            border-right: 0;
        }

        .list-group-item:first-child {
            border-top: 0;
        }

        .list-group-item:last-child {
            border-bottom: 0;
        }

        @media (max-width: 768px) {
            .position-fixed {
                position: static !important;
                height: auto !important;
            }

            .ms-auto {
                margin-left: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- side bar code is here-->
            <div class="col-md-3 col-lg-2 bg-dark text-white vh-100 position-fixed">
                <div class="sidebar-sticky pt-3">
                    <h2 class="px-3 mb-4">
                        Placement Portal
                    </h2>
                    <p class="text-muted px-3 small">Admin Portal</p>
                    <hr class="text-secondary">

                    <ul class="nav flex-column mb-5">
                        <li class="nav-item">
                            <a class="nav-link text-white active" href="{{url_for('admin')}}">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 active" href="{{url_for('admin_student')}}">
                                <i class="bi bi-building me-2"></i> Students
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 active" href="{{url_for('admin_companies')}}">
                                <i class="bi bi-building me-2"></i> Companies
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 active" href="{{url_for('admin_drives')}}">
                                <i class="bi bi-people me-2"></i> Drives
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 active" href="{{url_for('admin_reports')}}">
                                <i class="bi bi-calendar-event me-2"></i> Reports
                            </a>
                        </li>
                    </ul>
                    <hr class="text-secondary">

                    <ul class="flex-column mb-5 nav">
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="#">
                                <i class="bi bi-gear me-2"></i>Settings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="{{url_for('logout')}}">
                                <i class="bi bi-box-arrow-right me-2"></i>Log Out
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9 col-lg-10 ms-auto">
                <main class="p-4">
                    {% block content %}{% endblock %}
                </main>
            </div>

        </div>
    </div>
</body>

</html>
