<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registraion page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .main-co {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 30px;
        }

        .pro-cont {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-section {
            margin-bottom: 35px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-grid.single {
            grid-template-columns: 1fr;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            display: block;
        }

        .form-label.required::after {
            content: ' *';
            color: #d63031;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class=flashes>
        {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <div class="main-co">
        <div class="pro-cont">
            <div class="register_as">
                <button type="button" onclick="toggleForms()">Student</button>
                <button type="button" onclick="toggleForms()">Company</button>
            </div>
            <form id="form1" action="/register_company" method="POST">
                <h2>Company Registraion Form
                </h2>

                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label required" for="email">Email:</label>
                            <input class="form-control" type="email" name="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="username">Username:</label>
                            <input class="form-control" type="text" name="username" id="username" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="password">Password:</label>
                            <input class="form-control" type="password" name="password" id="password" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">Company Name :</label>
                            <input class="form-control" type="text" name="name" id="name" placeholder="Company Name"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">Hr Contact :</label>
                            <input class="form-control" type="text" name="hr" id="hr" placeholder="Hr Contact" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">Website :</label>
                            <input class="form-control" type="text" name="website" id="website" placeholder="Website"
                                required>
                        </div>
                    </div>
                </div>

                <br>
                <button class="btn btn-primary" style="margin-left: 500px;" type="submit">Register</button>

            </form>

            <form id="form2" action="/student_register" method="POST" style="display: none;">
                <h2>Student Registraion form</h2>


                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label required" for="email">Email:</label>
                            <input class="form-control" type="email" name="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="username">Username:</label>
                            <input class="form-control" type="text" name="username" id="username" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="password">Password:</label>
                            <input class="form-control" type="password" name="password" id="password" required>
                        </div>
                        <div class="form-group">

                            <label class="form-label required" for="name">Student Name :</label>
                            <input class="form-control" type="text" name="name" id="name" placeholder="Student Name"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">Branch :</label>
                            <input class="form-control" type="text" name="branch" id="branch" placeholder="branch"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">cgpa :</label>
                            <input class="form-control" type="float" name="cgpa" id="cgpa" placeholder="Cgpa..."
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="name">Resume Path :</label>
                            <input class="form-control" type="text" name="resume_path" id="resume_path"
                                placeholder="Resume..." required>
                        </div>

                    </div>
                </div>
                <br>
                <div style="justify-content: center;"><button class="btn btn-primary" style="margin-left: 500px;"
                        type="submit">Register</button>
                </div>


            </form>

            <div class="footer">
                <p>Already have an Account <a style="text-decoration: none;" href="{{url_for('login')}}">Login Here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            var form1 = document.getElementById('form1');
            var form2 = document.getElementById('form2');

            if (form1.style.display === 'none') {
                // If Form 1 is hidden, show it and hide Form 2
                form1.style.display = 'block';
                form2.style.display = 'none';
            } else {
                // If Form 1 is shown, hide it and show Form 2
                form1.style.display = 'none';
                form2.style.display = 'block';
            }
        }

    </script>
</body>

</html>
