<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{stud.name}} details</title>
    <style>
        body {
            margin-top: 100px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;


        }
    </style>
</head>

<body>
    <a href="{{url_for('admin_student')}}"><button>Go back</button></a>
    <h2>student Profile: {{ stud.name }}</h2>

    <div class="card">
        <p><strong>User ID:</strong> {{ stud.id }}</p>
        {% if stud.is_blacklisted == True %}
        <p><strong>Status:</strong>

            Blocked

        </p>
        {% else %}
        <p><strong>Status:</strong>
            Active
        </p>
        {% endif %}
        <p><strong>Branch:</strong> {{ stud.branch }}</p>
        <p><strong>Cgpa:</strong> {{ stud.cgpa }}</p>
        <p><strong>Resume:</strong> {{ stud.resume_path }}</p>

    </div>

    <div>
        <h1>All Applications for this student </h1>
        <P>add here .........</P>

    </div>
</body>

</html>
