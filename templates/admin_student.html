{% extends "admin_base.html" %}
{% block title %}Admin Student Page{% endblock %}
{% block content %}
<div class="main">
    <div class="search">
        <h1 class="h3 mb-1 mt-2">Student Management</h1>
        <div class="col-md-6 ms-auto">

            <input class="p-1" style="border-radius: 10px;" type="search" placeholder="Enter Name ...">
            <button class="p-1" style="border-radius: 50px;" type="submit">_Q_</button>
            <button style="border-radius: 10px;" class="bg-info p-1" type="submit">Add Student</button>
        </div>
    </div>
    <main class="p-4 mt-3">
        <div class=" p-3">
            <h5>Students</h5>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Sr.No</th>
                        <th>Student Name</th>
                        <th>Details</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Company 2</td>
                        <td><button style="border-radius: 10px;" class="bg-info">View Details</button></td>
                        <td><button style="border-radius: 10px;" class="bg-danger" type="button">Block</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class=" p-3 mt-3">
            <h5>Blocked Students</h5>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Sr.No</th>
                        <th>Student Name</th>
                        <th>Details</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Company 2</td>
                        <td><button style="border-radius: 10px;" class="bg-info">View Details</button></td>
                        <td><button style="border-radius: 10px;" class="bg-danger" type="button">Unblock</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
{% endblock %}
